[tools]
# beam
elixir = "1.20.4-otp-29"
erlang = "29.1.2"
"github:elixir-lang/expert" = "latest"
"github:remoteoss/dexter" = "latest"

# javascript
node = "26.12.1"
"npm:prettier" = "latest"
oxfmt = "latest"
"npm:oxlint" = "latest"

# databases
sqlite = "3.54.1"
"npm:@postgrestools/postgrestools" = "latest"
"github:sqls-server/sqls" = "latest"

# python for some reason
python = "3.15.2"

# general usage applications
bat = "latest"
jq = "latest"
ripgrep = "latest"

# ai
codex = "latest"
"npm:@agentclientprotocol/codex-acp" = "latest"

[env]
MISE_ENV_FILE = '.env'

EDITOR = 'emacs -nw -Q'

ERL_AFLAGS = "-kernel shell_history enabled"
BAT_THEME = "ansi"

[settings]
experimental = true
